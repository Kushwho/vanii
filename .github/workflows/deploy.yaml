name: CD for AWS EC2

on:
  push:
    branches:
      - backend  

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      # Check out the code
      - name: Checkout code
        uses: actions/checkout@v2

      # Deploy to the AWS EC2 instance
      - name: Deploy to AWS
        env:
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
          SERVER_IP: ${{ secrets.AWS_SERVER_IP }}
          USER: ${{ secrets.AWS_USER }}
        run: |
          echo "$SSH_PRIVATE_KEY" > key.pem
          chmod 600 key.pem
          ssh -o StrictHostKeyChecking=no -i key.pem $USER@$SERVER_IP << 'EOF'
            cd /home/ubuntu/vanii-project/vanii-socket
            git pull origin backend
            
            # Build new Docker image
            docker build -t vanii-livekit .
            
            # Stop and remove the old container if it exists
            docker stop vanii-livekit-container || true
            docker rm vanii-livekit-container || true
            
            # Run the new container
            docker run -d \
              --name vanii-livekit-container \
              --restart unless-stopped \
              -p 4000:4000 \
              --env-file .env \
              vanii-livekit
            
            # Clean up unused images (optional)
            docker system prune -f
          EOF
          rm key.pem